# SonarQube Community Build scan settings. How to run it: docs/testing/sonarqube.md
# The token is passed as SONAR_TOKEN when the scanner runs. Never write it here.
sonar.projectKey=jurwa
sonar.projectName=Jurwa
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=proto/gen/**,**/*_test.go,**/mocks/**,web/node_modules/**,web/dist/**,**/*.pb.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=web/node_modules/**

# Made by: go test ./... -coverprofile=coverage.out
sonar.go.coverage.reportPaths=coverage.out
