# Serves the built web app (SCRUM-140). Port 8080, as the Deployment and its
# readiness probe (GET / on 8080) expect.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Built files have a content hash in their name, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Installable app (SCRUM-98): the browser checks sw.js for a new version on
    # every visit, so it is never cached; the manifest gets its own type.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Every other path is a page of the app: serve the file if it exists,
    # otherwise index.html, and let the app's router pick the page.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
