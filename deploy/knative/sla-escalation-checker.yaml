# sla-escalation-checker as a Knative Service (SCRUM-104). Owner: Nyendrak.
# It scales to zero: no pod runs between checks. The PingSource in
# pingsource.yaml sends it a POST on a schedule, which starts a pod; the pod
# does one check and Knative removes it again about a minute later.
# Only reachable inside the cluster (cluster-local), never through Traefik.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sla-escalation-checker
  namespace: jurwa
  labels:
    app.kubernetes.io/name: sla-escalation-checker
    app.kubernetes.io/part-of: jurwa
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sla-escalation-checker
        app.kubernetes.io/part-of: jurwa
      annotations:
        autoscaling.knative.dev/min-scale: "0" # scale to zero between runs
        autoscaling.knative.dev/max-scale: "1" # one check at a time is enough
    spec:
      containerConcurrency: 1
      timeoutSeconds: 60
      # The function does not call the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - image: jurwa-registry:5050/sla-escalation-checker:latest
          ports:
            - containerPort: 8080
          env:
            - name: SLA_TRACKING_ADDR
              value: sla-tracking:9012
            - name: STATUS_LIFECYCLE_ADDR
              value: status-lifecycle:9011
          # No HTTP probe: GET / runs a check, so Knative's default TCP probe is used.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
