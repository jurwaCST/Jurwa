# EXAMPLE ONLY, fake values. Not part of kustomization.yaml and never applied.
# The real Secret is made from dev/.env by scripts/create-secrets.sh.
# Use passwords without @ : / ? # so they work inside the connection URLs.
apiVersion: v1
kind: Secret
metadata:
  name: jurwa-secrets
  namespace: jurwa
type: Opaque
stringData:
  postgres-user: jurwa
  postgres-password: example-postgres-password
  mongo-user: jurwa
  mongo-password: example-mongo-password
  redis-password: example-redis-password
  jwt-secret: example-jwt-secret-at-least-32-characters
  demo-password: example-demo-password
