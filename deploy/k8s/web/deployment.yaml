# The web app (React PWA, SCRUM-139): static files served on port 8080 by the
# image built from web/Dockerfile. The browser calls the API on the same HTTPS
# address under /api (VITE_API_URL=/api at build time), so it needs no settings
# and no secrets here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: jurwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: jurwa
    spec:
      # The web server does not call the Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: web
          image: jurwa-registry:5050/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
