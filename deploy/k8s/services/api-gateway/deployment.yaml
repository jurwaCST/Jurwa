              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
          readinessProbe:
            grpc:
              port: 9010
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9010
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
