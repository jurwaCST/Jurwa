apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: jurwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
        app.kubernetes.io/part-of: jurwa
    spec:
      # No Jurwa service calls the Kubernetes API, so no service account token is
      # mounted (SonarQube rule: bind to RBAC or disable automounting).
      automountServiceAccountToken: false
      containers:
        - name: notification
          image: jurwa-registry:5050/notification:latest
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 9018
          envFrom:
            - configMapRef:
                name: notification-config
          # Passwords come from the Secret jurwa-secrets (scripts/create-secrets.sh).
          # $(VAR) uses a variable defined above it in this list.
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jurwa-secrets
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jurwa-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jurwa-secrets
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/notification?sslmode=disable"
