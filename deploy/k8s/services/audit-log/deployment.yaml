apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-log
  labels:
    app.kubernetes.io/name: audit-log
    app.kubernetes.io/part-of: jurwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-log
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-log
        app.kubernetes.io/part-of: jurwa
    spec:
      # No Jurwa service calls the Kubernetes API, so no service account token is
      # mounted (SonarQube rule: bind to RBAC or disable automounting).
      automountServiceAccountToken: false
      containers:
        - name: audit-log
          image: jurwa-registry:5050/audit-log:latest
          imagePullPolicy: Always
          ports:
            - name: grpc
              containerPort: 9015
          envFrom:
            - configMapRef:
                name: audit-log-config
          # Passwords come from the Secret jurwa-secrets (scripts/create-secrets.sh).
          # $(VAR) uses a variable defined above it in this list.
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jurwa-secrets
                  key: redis-password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: jurwa-secrets
                  key: mongo-user
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jurwa-secrets
                  key: mongo-password
            - name: MONGO_URL
              value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongo:27017/?authSource=admin"
          readinessProbe:
            grpc:
              port: 9015
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9015
            initialDelaySeconds: 10
