apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jurwa

resources:
  - deployment.yaml
  - service.yaml

# Configuration as environment variables. Kustomize adds a hash to the name,
# so changing a value rolls the pods automatically.
configMapGenerator:
  - name: example-config
    literals:
      - PORT=9001
      - LOG_LEVEL=info
