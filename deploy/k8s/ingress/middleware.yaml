# Removes /api before the request reaches api-gateway:
# https://jurwa.localtest.me/api/categories -> api-gateway /categories
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
spec:
  stripPrefix:
    prefixes:
      - /api
---
# Sends plain http:// requests to https://.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
