# Prometheus and Grafana for Jurwa:  kubectl apply -k deploy/observability
# Apply deploy/k8s first (it creates the namespace). Owner: Gayley Choden (SCRUM-105).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jurwa

resources:
  - prometheus.yaml
  - grafana.yaml

# Generated config maps get a name with a hash, so a changed file restarts the pod.
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-dashboards
    files:
      - dashboards/jurwa-services.json
