# Prometheus scrape config, loaded by kustomization.yaml (configMapGenerator).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: jurwa-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [jurwa]
    relabel_configs:
      # Only pods that ask to be scraped.
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      # Port from prometheus.io/port, 9100 when the annotation is missing.
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ""
        replacement: "9100"
        target_label: __meta_kubernetes_pod_annotation_prometheus_io_port
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__
      # Labels for the dashboard: which service and which pod.
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
