name: Images

# Builds the image of every service. On main it also pushes them to GitHub
# Container Registry as ghcr.io/jurwacst/jurwa/<service>:<commit sha> and :latest.
# On a pull request it only builds (no push), and only when a Dockerfile, the
# deploy folder or this file changes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "services/*/Dockerfile"
      - "deploy/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - report-submission
          - photo-media
          - report-history
          - location-taxonomy
          - internal-notes
          - routing-rules
          - routing-engine
          - department-directory
          - category-taxonomy
          - api-gateway
          - status-lifecycle
          - sla-tracking
          - sla-policy
          - reassignment
          - audit-log
          - identity
          - authorization
          - notification
          - feedback
          - analytics
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/jurwacst/jurwa/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/jurwacst/jurwa/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
