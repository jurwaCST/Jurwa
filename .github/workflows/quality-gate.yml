name: Quality gate

# Fails a pull request when a critical package (domain and application of the
# routing, SLA and status-flow services) is under 70% statement coverage or its
# tests fail. SonarQube runs on a laptop (CI cannot reach it), so this script is
# the gate in CI. See docs/testing/sonarqube.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The repository is public, so a committed key is visible to everyone. Scans
  # every commit with gitleaks (free, open source). Reviewed test values are in
  # .gitleaksignore (SCRUM-151).
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the whole history (values redacted)
        run: gitleaks git . --log-opts="--all" --redact --verbose

  coverage:
    name: Coverage of critical packages (70%)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test the gate script itself
        run: bash scripts/tests/check-coverage_test.sh

      - name: Test the web app manifests and push script (SCRUM-139)
        run: bash scripts/tests/web-deploy_test.sh

      - name: Coverage gate
        run: bash scripts/check-coverage.sh

      # Information only: every test of the repository is already a required
      # check in CI / Go checks. A failing test is printed here, not hidden.
      - name: Coverage report for the whole repository (information only)
        if: always()
        continue-on-error: true
        run: |
          if ! go test ./... -coverprofile=coverage.out > test-output.txt 2>&1; then
            grep -E -- '^(--- FAIL|FAIL|panic)' -A 8 test-output.txt
            exit 1
          fi
          go tool cover -func=coverage.out | tail -1

      - name: Keep coverage.out (for SonarQube on a laptop)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
